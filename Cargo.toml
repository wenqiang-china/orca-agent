[workspace]
members = [
    "crates/*",
    "tools/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yourusername/orca-agent"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"

# CLI & TUI
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
walkdir = "2.5"
regex = "1.10"
once_cell = "1.19"
dirs = "5.0"
which = "6.0"

# Workspace crates
orca-core = { path = "crates/orca-core" }
orca-loop-guard = { path = "crates/orca-loop-guard" }
orca-capacity = { path = "crates/orca-capacity" }
orca-checkpoint = { path = "crates/orca-checkpoint" }
orca-seam = { path = "crates/orca-seam" }
orca-sandbox = { path = "crates/orca-sandbox" }
orca-tools = { path = "crates/orca-tools" }
orca-arg-repair = { path = "crates/orca-arg-repair" }
orca-name-resolver = { path = "crates/orca-name-resolver" }
orca-providers = { path = "crates/orca-providers" }
orca-deepseek = { path = "crates/orca-deepseek" }
orca-anthropic = { path = "crates/orca-anthropic" }
orca-openai = { path = "crates/orca-openai" }
orca-mcp = { path = "crates/orca-mcp" }
orca-config = { path = "crates/orca-config" }
orca-events = { path = "crates/orca-events" }
orca-utils = { path = "crates/orca-utils" }
orca-cli = { path = "crates/orca-cli" }
orca-tui = { path = "crates/orca-tui" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
